version: '3.8'
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - APP_PASSWORD=${APP_PASSWORD:-rent123}
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/techtrove
      - SPRING_DATASOURCE_USERNAME=techtrove
      - SPRING_DATASOURCE_PASSWORD=techtrove
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=techtrove
      - POSTGRES_USER=techtrove
      - POSTGRES_PASSWORD=techtrove
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
