<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.json">
<title>TechTrove Rental Tracker</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <svg viewBox="0 0 40 40" width="48" height="48">
        <rect width="40" height="40" rx="10" fill="#2563eb"/>
        <text x="20" y="27" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">TT</text>
      </svg>
    </div>
    <h1>Welcome Back</h1>
    <p class="login-sub">Sign in to TechTrove</p>
    <div class="login-form">
      <div class="login-input-group">
        <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="loginPassword" placeholder="Password" autocomplete="off">
      </div>
      <div id="loginError" class="login-error hidden">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        Incorrect password
      </div>
      <button id="loginBtn" class="btn btn-primary btn-block">Sign In</button>
    </div>
  </div>
</div>

<div id="app" class="hidden">
  <header id="appHeader">
    <button id="headerBack" class="header-btn hidden" aria-label="Back">&#8592;</button>
    <h1 id="headerTitle">TechTrove</h1>
    <button id="headerAction" class="header-btn" aria-label="Settings">&#9881;</button>
  </header>

  <div id="dueBanner" class="due-alert-banner hidden" onclick="UI.navigate('dashboard')"></div>
  <main id="mainContent">
    <section id="page-dashboard" class="page active"></section>
    <section id="page-customers" class="page"></section>
    <section id="page-customer-detail" class="page"></section>
    <section id="page-inventory" class="page"></section>
    <section id="page-search" class="page"></section>
    <section id="page-more" class="page"></section>
  </main>

  <nav id="bottomNav">
    <button class="nav-btn active" data-page="dashboard">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span class="nav-label">Home</span>
      <span id="notifBadge" class="notif-badge hidden"></span>
    </button>
    <button class="nav-btn" data-page="customers">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span class="nav-label">Clients</span>
    </button>
    <button class="nav-btn" data-page="inventory">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
      <span class="nav-label">Items</span>
    </button>
    <button class="nav-btn" data-page="search">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span class="nav-label">Search</span>
    </button>
    <button class="nav-btn" data-page="more">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      <span class="nav-label">More</span>
    </button>
  </nav>
</div>

<div id="modalOverlay" class="modal-overlay hidden" onclick="if(event.target===this)UI.hideModal()">
  <div id="modalContent" class="modal-content"></div>
</div>

<button id="fabAdd" class="fab hidden" aria-label="Add">+</button>
<div id="toast" class="toast"></div>
<div id="confirmOverlay" class="modal-overlay hidden" onclick="if(event.target===this)UI.hideConfirm()">
  <div id="confirmContent" class="modal-content confirm-box"></div>
</div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
