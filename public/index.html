<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.json">
<title>TechTrove Rental Tracker</title>
<link rel="stylesheet" href="styles.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="splash" class="splash"><div class="spinner"></div></div>
<div id="loginScreen" class="login-screen hidden">
    <div class="login-box">
      <div class="login-google-header">
        <svg viewBox="0 0 48 48" width="48" height="48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.54 28.59A14.5 14.5 0 0 1 9.5 24c0-1.59.28-3.14.76-4.59l-7.98-6.19A23.5 23.5 0 0 0 0 24c0 3.77.88 7.35 2.56 10.59l7.98-6z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6C6.51 42.62 14.62 48 24 48z"/></svg>
      </div>
      <h1>Sign in</h1>
      <p class="login-sub">with TechTrove</p>
      <div class="login-form">
        <div id="g_id_onload"
          data-client_id="743684664950-cqj0oq9ktbrch7jo3cqt0o8i8t5717gm.apps.googleusercontent.com"
          data-context="signin"
          data-ux_mode="popup"
          data-callback="handleGoogleCredential"
          data-auto_prompt="false">
        </div>
        <div id="googleBtn" class="g_id_signin"
          data-type="standard"
          data-shape="rectangular"
          data-theme="outline"
          data-text="signin_with"
          data-size="large"
          data-width="300"
          data-logo_alignment="left">
        </div>
        <div class="login-divider"><span>or</span></div>
        <div class="login-input-group">
          <input type="password" id="loginPassword" placeholder="Enter password" autocomplete="current-password">
        </div>
        <div id="loginError" class="login-error hidden">Wrong password. Try again.</div>
        <button id="loginBtn" class="google-btn" style="border-color:var(--gray-400);color:var(--gray-600);font-weight:400">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Sign in with password
        </button>
        <p class="login-hint">First time? Sign in once &amp; you're set forever</p>
      </div>
    </div>
    <div id="loginLoading" class="login-loading hidden"><div class="spinner"></div></div>
  </div>

<div id="app" class="hidden">
  <header id="appHeader">
    <button id="headerBack" class="header-btn hidden" aria-label="Back">&#8592;</button>
    <h1 id="headerTitle">TechTrove</h1>
    <button id="headerAction" class="header-btn" aria-label="Settings">&#9881;</button>
  </header>

  <div id="dueBanner" class="due-alert-banner hidden" onclick="UI.navigate('dashboard')"></div>
  <main id="mainContent">
    <section id="page-dashboard" class="page active"></section>
    <section id="page-customers" class="page"></section>
    <section id="page-customer-detail" class="page"></section>
    <section id="page-inventory" class="page"></section>
    <section id="page-search" class="page"></section>
    <section id="page-more" class="page"></section>
  </main>

  <nav id="bottomNav">
    <button class="nav-btn active" data-page="dashboard">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span class="nav-label">Home</span>
      <span id="notifBadge" class="notif-badge hidden"></span>
    </button>
    <button class="nav-btn" data-page="customers">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span class="nav-label">Clients</span>
    </button>
    <button class="nav-btn" data-page="inventory">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
      <span class="nav-label">Items</span>
    </button>
    <button class="nav-btn" data-page="search">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span class="nav-label">Search</span>
    </button>
    <button class="nav-btn" data-page="more">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      <span class="nav-label">More</span>
    </button>
  </nav>
</div>

<div id="modalOverlay" class="modal-overlay hidden" onclick="if(event.target===this)UI.hideModal()">
  <div id="modalContent" class="modal-content"></div>
</div>

<button id="fabAdd" class="fab hidden" aria-label="Add">+</button>
<div id="toast" class="toast"></div>
<div id="confirmOverlay" class="modal-overlay hidden" onclick="if(event.target===this)UI.hideConfirm()">
  <div id="confirmContent" class="modal-content confirm-box"></div>
</div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
