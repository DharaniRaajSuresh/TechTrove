<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1A1D24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>TechTrove Systems Rental Tracker</title>
<link rel="stylesheet" href="styles.css?v=5.2-hardware-cards">
</head>
<body>
  <div id="splash" class="splash"><div class="spinner"></div></div>
  <div id="loginScreen" class="login-screen hidden">
    <div class="login-bg-art">
      <svg viewBox="0 0 375 280" width="375" height="280" preserveAspectRatio="none" style="position:absolute;top:0;left:0;width:100%">
        <path d="M0 0h375v200c-62.5 40-156.25 60-250 40C62.5 224 31.25 212 0 200V0z" fill="var(--accent)" opacity=".08"/>
        <path d="M0 0h375v160c-83.3 30-166.7 20-250 10-41.7-5-83.3-10-125-30V0z" fill="var(--accent)" opacity=".05"/>
      </svg>
    </div>
    <div class="login-box">
      <div class="login-brand">
        <img src="icon.png" alt="TechTrove Emblem" width="56" height="56" style="display:block;margin:0 auto;object-fit:contain;">
      </div>
      <h1>TechTrove Systems</h1>
      <p class="login-sub">Rental Management System</p>
      <div class="login-form">
        <div class="login-input-group">
          <svg class="login-input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
        </div>
        <div id="loginError" class="login-error hidden">Incorrect password</div>
        <button id="loginBtn" class="btn btn-primary btn-block">
          <span>Sign In</span>
          <svg class="btn-arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
        <p class="login-hint">Admin (full control) or Employee (operations)</p>
      </div>
    </div>
  </div>

<div id="app" class="hidden">
  <!-- Desktop Left Sidebar (Visible on ≥768px / ≥1200px) -->
  <aside id="desktopSidebar" class="desktop-sidebar">
    <div class="desktop-sidebar-brand" onclick="UI.navigate('dashboard')">
      <img src="icon.png" alt="TechTrove Logo" width="36" height="36" class="desktop-brand-img">
      <div class="desktop-brand-text">
        <span class="desktop-brand-title">TechTrove</span>
        <span class="desktop-brand-sub">Ops Console</span>
      </div>
    </div>

    <nav class="desktop-sidebar-nav">
      <button class="desktop-nav-item active" data-page="dashboard" onclick="UI.navigate('dashboard')">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
        <span>Dashboard</span>
        <span id="desktopNotifBadge" class="desktop-notif-badge hidden">0</span>
      </button>
      <button class="desktop-nav-item" data-page="inventory" onclick="UI.navigate('inventory')">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
        <span>Inventory</span>
      </button>
      <button class="desktop-nav-item" data-page="customers" onclick="UI.navigate('customers')">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Customers</span>
      </button>
      <button class="desktop-nav-item" data-page="repairs" onclick="UI.openRepairsFilter()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        <span>Repairs</span>
      </button>
      <button class="desktop-nav-item" data-page="more" onclick="UI.navigate('more')">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Settings & More</span>
      </button>
    </nav>

    <div class="desktop-sidebar-footer">
      <div class="desktop-cloud-status">
        <span class="status-dot ok"></span>
        <span class="desktop-cloud-text">Cloud Sync Live</span>
      </div>
      <button class="desktop-theme-toggle" onclick="UI.toggleTheme()" title="Toggle Dark/Light Mode">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
    </div>
  </aside>

  <!-- Main Content Column -->
  <div class="desktop-main-wrapper">
    <!-- Desktop Persistent Topbar (Visible on ≥768px / ≥1200px) -->
    <header id="desktopTopbar" class="desktop-topbar">
      <div class="desktop-topbar-left">
        <h1 id="desktopHeaderTitle" class="desktop-page-title">TechTrove Console</h1>
      </div>
      <div class="desktop-topbar-center">
        <div class="desktop-search-wrap">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="desktopGlobalSearch" placeholder="Search customers, devices, serials..." oninput="UI.handleDesktopSearch(this.value)">
          <kbd class="desktop-search-kbd">/</kbd>
        </div>
      </div>
      <div class="desktop-topbar-right" id="desktopTopbarActions">
        <button class="btn btn-primary btn-sm" id="desktopPrimaryBtn" onclick="UI.handleDesktopPrimaryAction()">
          <span>+ New Rental</span>
        </button>
      </div>
    </header>

    <!-- Mobile Header (<768px only) -->
    <header id="appHeader">
      <button id="headerBack" class="header-btn hidden" aria-label="Back" onclick="UI.goBack()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <h1 id="headerTitle">TechTrove Console</h1>
      <button class="header-btn" aria-label="Search" onclick="UI.pushPage('search')">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <button id="headerAction" class="header-btn" aria-label="Settings" onclick="UI.pushPage('more')">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <div id="dueBanner" class="due-alert-banner hidden" onclick="UI.navigate('dashboard')"></div>
    <main id="mainContent">
      <section id="page-dashboard" class="page active"></section>
      <section id="page-customers" class="page"></section>
      <section id="page-customer-detail" class="page"></section>
      <section id="page-inventory" class="page"></section>
      <section id="page-repairs" class="page"></section>
      <section id="page-search" class="page"></section>
      <section id="page-more" class="page"></section>
    </main>

    <!-- Mobile Bottom Navigation (<768px only) -->
    <nav id="bottomNav">
      <button class="nav-btn active" data-page="dashboard" onclick="UI.navigate('dashboard')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
        <span class="nav-label">Dashboard</span>
        <span id="notifBadge" class="notif-badge hidden"></span>
      </button>
      <button class="nav-btn" data-page="inventory" onclick="UI.navigate('inventory')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
        <span class="nav-label">Inventory</span>
      </button>
      <button class="nav-btn" data-page="customers" onclick="UI.navigate('customers')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span class="nav-label">Customers</span>
      </button>
      <button class="nav-btn" data-page="repairs" onclick="UI.openRepairsFilter()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        <span class="nav-label">Repairs</span>
      </button>
    </nav>
  </div>
</div>

<div id="modalOverlay" class="modal-overlay hidden" onclick="if(event.target===this)UI.hideModal()">
  <div id="modalContent" class="modal-content"></div>
</div>

<div id="loadingOverlay" class="loading-overlay hidden"><div class="spinner"></div></div>
<button id="fabAdd" class="fab hidden" aria-label="Add">+</button>
<div id="toast" class="toast"></div>
<div id="confirmOverlay" class="modal-overlay hidden" onclick="if(event.target===this)UI.hideConfirm()">
  <div id="confirmContent" class="modal-content confirm-box"></div>
</div>

<script src="app.js?v=5.2-hardware-cards"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js?v=5.2-hardware-cards').then(function(reg) {
    reg.update();
  }).catch(function(){});
}
</script>
</body>
</html>
