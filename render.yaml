services:
  - type: web
    name: techtrove-rental-tracker
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: APP_PASSWORD
        value: ""  # Set via Render dashboard — do not hardcode passwords in config files
      - key: DATA_DIR
        value: /data
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
